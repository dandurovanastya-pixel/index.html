<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Wolves and Rabbits</title>
<style>
:root{--blue:#4aa9df;--blue-dark:#2378ad;--red:#e85b61;--red-dark:#b83b43;--light:#f7f1df;--dark:#75a65b;--ink:#18324a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#dff5ff,#f8fcff 55%,#fff4e6);padding:20px;overscroll-behavior:none}.app{width:min(1100px,100%);margin:auto}
h1{margin:0 0 18px;text-align:center;font-size:clamp(30px,5vw,52px);color:var(--blue-dark)}
.game{display:grid;grid-template-columns:minmax(300px,760px) 250px;gap:24px;align-items:center;justify-content:center}
.board-wrap{width:100%;aspect-ratio:1;border:10px solid #fff;border-radius:24px;box-shadow:0 12px 30px #276b8c33;background:#fff;touch-action:none}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden;border-radius:14px}
.cell{position:relative;display:flex;align-items:center;justify-content:center}.cell.light{background:var(--light)}.cell.dark{background:var(--dark)}
.token{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,6vw,58px);box-shadow:0 5px 10px #0003;border:4px solid #fff;user-select:none;touch-action:none;cursor:grab;z-index:5;transition:transform .12s,box-shadow .12s}
.token.rabbit{background:var(--blue)}.token.wolf{background:var(--red)}.token.dragging{cursor:grabbing;transform:none;box-shadow:0 8px 16px #0003;position:fixed;z-index:1000;pointer-events:none;width:var(--drag-w);height:var(--drag-h)}
.side{background:#ffffffd9;border:3px solid #fff;border-radius:24px;padding:20px;box-shadow:0 10px 25px #276b8c22;text-align:center}
.dice{width:150px;height:150px;margin:0 auto 14px;background:#fff;border-radius:25px;border:5px solid var(--blue-dark);box-shadow:0 8px 18px #0002;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:18px;gap:6px;cursor:pointer;user-select:none;touch-action:manipulation}.dice.rolling{animation:spin .18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:20px;height:20px;background:var(--blue-dark);border-radius:50%;align-self:center;justify-self:center}.d1 .dot:nth-child(1){grid-area:2/2}.d2 .dot:nth-child(1){grid-area:1/1}.d2 .dot:nth-child(2){grid-area:3/3}.d3 .dot:nth-child(1){grid-area:1/1}.d3 .dot:nth-child(2){grid-area:2/2}.d3 .dot:nth-child(3){grid-area:3/3}.d4 .dot:nth-child(1){grid-area:1/1}.d4 .dot:nth-child(2){grid-area:1/3}.d4 .dot:nth-child(3){grid-area:3/1}.d4 .dot:nth-child(4){grid-area:3/3}.d5 .dot:nth-child(1){grid-area:1/1}.d5 .dot:nth-child(2){grid-area:1/3}.d5 .dot:nth-child(3){grid-area:2/2}.d5 .dot:nth-child(4){grid-area:3/1}.d5 .dot:nth-child(5){grid-area:3/3}.d6 .dot:nth-child(1){grid-area:1/1}.d6 .dot:nth-child(2){grid-area:1/3}.d6 .dot:nth-child(3){grid-area:2/1}.d6 .dot:nth-child(4){grid-area:2/3}.d6 .dot:nth-child(5){grid-area:3/1}.d6 .dot:nth-child(6){grid-area:3/3}
.roll{font-size:clamp(22px,3vw,30px);font-weight:800;margin:10px 0 18px}button{border:0;border-radius:14px;padding:13px 25px;font-size:20px;font-weight:800;color:#fff;background:var(--red);cursor:pointer;box-shadow:0 5px 0 var(--red-dark);touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-dark)}.hint{font-size:14px;line-height:1.4;margin-top:15px;color:#426078}
@media(max-width:800px){body{padding:12px}.game{grid-template-columns:1fr;gap:16px}.side{padding:14px}.dice{width:120px;height:120px;padding:14px}.dot{width:16px;height:16px}.hint{margin-top:10px}}
</style></head><body><div class="app"><h1>🐺 Wolves and Rabbits 🐰</h1><div class="game"><div class="board-wrap"><div class="board" id="board"></div></div><aside class="side"><div class="dice d1" id="dice" role="button" aria-label="Roll dice" tabindex="0"><span class="dot"></span></div><div class="roll" id="rollText">You rolled: —</div><button id="resetBtn">Reset</button><div class="hint">Drag 🐰 or 🐺 to any square.</div></aside></div></div>
<script>
/* Teacher settings: change emojis/colors here. */
const PIECES={rabbit:{emoji:"🐰",colorClass:"rabbit",start:[0,0]},wolf:{emoji:"🐺",colorClass:"wolf",start:[7,7]}};
const board=document.getElementById("board"),dice=document.getElementById("dice"),rollText=document.getElementById("rollText"),resetBtn=document.getElementById("resetBtn");
let positions={rabbit:[0,0],wolf:[7,7]},dragging=null,dragStart=null,dragEl=null,offsetX=0,offsetY=0,dragW=0,dragH=0,rolling=false;
const idx=(r,c)=>r*8+c;
function buildBoard(){board.innerHTML="";for(let r=0;r<8;r++)for(let c=0;c<8;c++){const cell=document.createElement("div");cell.className="cell "+((r+c)%2===0?"light":"dark");cell.dataset.row=r;cell.dataset.col=c;board.appendChild(cell)}renderPieces()}
function renderPieces(){document.querySelectorAll(".token").forEach(e=>e.remove());for(const[type,p]of Object.entries(PIECES)){const [r,c]=positions[type],cell=board.children[idx(r,c)],token=document.createElement("div");token.className=`token ${p.colorClass}`;token.dataset.type=type;token.textContent=p.emoji;token.addEventListener("pointerdown",startDrag);cell.appendChild(token)}}
function startDrag(e){if(e.button!==undefined&&e.button!==0)return;dragging=e.currentTarget.dataset.type;dragStart=[...positions[dragging]];dragEl=e.currentTarget;const rect=dragEl.getBoundingClientRect();offsetX=e.clientX-(rect.left+rect.width/2);offsetY=e.clientY-(rect.top+rect.height/2);dragW=rect.width;dragH=rect.height;dragEl.style.setProperty("--drag-w",dragW+"px");dragEl.style.setProperty("--drag-h",dragH+"px");dragEl.classList.add("dragging");dragEl.setPointerCapture?.(e.pointerId);moveDrag(e);e.preventDefault()}
function moveDrag(e){if(!dragEl)return;dragEl.style.left=(e.clientX-offsetX-dragW/2)+"px";dragEl.style.top=(e.clientY-offsetY-dragH/2)+"px"}
function endDrag(e){if(!dragEl)return;const rect=board.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,col=Math.max(0,Math.min(7,Math.floor(x/(rect.width/8)))),row=Math.max(0,Math.min(7,Math.floor(y/(rect.height/8))));const other=dragging==="rabbit"?"wolf":"rabbit",occupied=positions[other][0]===row&&positions[other][1]===col;dragEl.classList.remove("dragging");dragEl.style.left="";dragEl.style.top="";dragEl.style.removeProperty("--drag-w");dragEl.style.removeProperty("--drag-h");positions[dragging]=occupied?dragStart:[row,col];dragging=dragStart=dragEl=null;dragW=dragH=0;renderPieces();e.preventDefault()}
document.addEventListener("pointermove",moveDrag,{passive:false});document.addEventListener("pointerup",endDrag,{passive:false});document.addEventListener("pointercancel",endDrag,{passive:false});
function showDice(n){dice.className="dice d"+n;dice.innerHTML="";for(let i=0;i<n;i++){const d=document.createElement("span");d.className="dot";dice.appendChild(d)}}
function rollDice(){if(rolling)return;rolling=true;dice.classList.add("rolling");let ticks=0;const timer=setInterval(()=>{showDice(1+Math.floor(Math.random()*6));if(++ticks>=8){clearInterval(timer);const n=1+Math.floor(Math.random()*6);showDice(n);dice.classList.remove("rolling");rollText.textContent="You rolled: "+n;rolling=false}},120)}
dice.addEventListener("click",rollDice);dice.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rollDice()}});
resetBtn.addEventListener("click",()=>{positions={rabbit:[0,0],wolf:[7,7]};showDice(1);rollText.textContent="You rolled: —";renderPieces()});buildBoard();showDice(1);
</script></body></html>
